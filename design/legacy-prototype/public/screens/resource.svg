<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" role="group" aria-labelledby="title desc"><title id="title">Resource explainer / LLM APIs</title><desc id="desc">Resource explainer / LLM APIs</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="234" height="1000" rx="0" fill="white" stroke="none"/><path d="M234 0 L234 1000" stroke="#e3eaf4"/><rect x="30" y="30" width="31" height="31" rx="8" fill="#2563eb" stroke="none"/><svg x="35" y="35" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="72" y="53" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">fieldwork</text><rect x="22" y="94" width="190" height="46" rx="9" fill="#f8fafc" stroke="#e3eaf4"/><svg x="35" y="107" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><text x="66" y="122" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#10213e" text-anchor="start">Personal workspace</text><text x="30" y="180" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="start">LEARN &amp; BUILD</text><a href="#dashboard" aria-label="dashboard"><svg x="32" y="207" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><text x="65" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Overview</text></a><a href="#journey" aria-label="journey"><svg x="32" y="255" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="65" y="270" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Learning journey</text></a><a href="#library" aria-label="library"><rect x="18" y="292" width="198" height="42" rx="8" fill="#eff6ff" stroke="none"/><svg x="32" y="303" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M3 4c5-1 7 0 9 2 3-2 6-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2Z"/></svg><text x="65" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">Resource library</text></a><a href="#card-concept" aria-label="card-concept"><svg x="32" y="351" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="14" height="16" rx="2"/><path d="M17 2H4a2 2 0 0 0-2 2v13m10-5h5m-5 4h4"/></svg><text x="65" y="366" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Flashcard practice</text></a><a href="#checkpoint" aria-label="checkpoint"><svg x="32" y="399" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3c6-3 8 3 14 0v11c-6 3-8-3-14 0"/></svg><text x="65" y="414" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Checkpoints</text></a><a href="#labs" aria-label="labs"><svg x="32" y="447" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><text x="65" y="462" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Hands-on labs</text><rect x="170" y="448" width="36" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="181" y="465" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">Soon</text></a><path d="M28 510 L206 510" stroke="#e3eaf4"/><text x="30" y="542" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="start">WORKSPACE</text><a href="#progress" aria-label="progress"><svg x="32" y="567" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v17h17M9 15v-4m5 4V7m5 8V4"/></svg><text x="65" y="582" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">My progress</text></a><a href="#team" aria-label="team"><svg x="32" y="612" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-3a6 6 0 0 1 12 0v3m2-17a4 4 0 0 1 0 8m2 3a5 5 0 0 1 4 6"/></svg><text x="65" y="627" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Team overview</text></a><a href="#settings" aria-label="settings"><svg x="32" y="657" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 17h18M8 3v8m8 2v8"/></svg><text x="65" y="672" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Preferences</text></a><rect x="20" y="793" width="194" height="112" rx="10" fill="#eff6ff" stroke="none"/><svg x="35" y="808" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="35" y="849" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#10213e" text-anchor="start">Small sessions. Real growth.</text><text x="35" y="870" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="start">Build a habit in 10 minutes a day.</text><path d="M20 926 L214 926" stroke="#e3eaf4"/><rect x="28" y="946" width="32" height="32" rx="16" fill="#dbeafe" stroke="none"/><text x="44" y="966" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">AJ</text><text x="71" y="958" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#10213e" text-anchor="start">Alex Jordan</text><text x="71" y="975" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="start">DevOps engineer</text><rect x="235" y="0" width="1205" height="76" rx="0" fill="white" stroke="none"/><path d="M235 76 L1440 76" stroke="#e3eaf4"/><text x="270" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Workspace</text><text x="349" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start">/</text><text x="368" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#10213e" text-anchor="start">Library / Python + APIs</text><a href="#library" aria-label="library"><rect x="974" y="20" width="283" height="36" rx="7" fill="#f8fafc" stroke="#e3eaf4"/><svg x="987" y="29" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><text x="1013" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Search concepts, decks, resources</text></a><svg x="1283" y="28" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 6 3 8H3c0-2 3-2 3-8m4 12h4"/></svg><rect x="1329" y="21" width="33" height="33" rx="17" fill="#dbeafe" stroke="none"/><text x="1345" y="42" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">AJ</text><rect x="1375" y="26" width="47" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1386" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">Free</text><text x="270" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="start">FIELDWORK / DEVOPS TO FDE</text><text x="1398" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="end">Design concept · illustrative learner data</text><text x="270" y="118" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">GUIDE · 6 MIN READ · PYTHON + APIS</text><text x="270" y="158" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#10213e" text-anchor="start">An API is still an API.</text><text x="270" y="187" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A practical introduction to LLM calls for people who already work with services.</text><rect x="270" y="223" width="762" height="688" rx="14" fill="white" stroke="#e3eaf4"/><rect x="297" y="247" width="235" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="308" y="264" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">START WITH WHAT YOU KNOW</text><text x="297" y="310" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">You already understand the pattern.</text><text x="297" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">An LLM API accepts a request and returns a response, just like the services you</text><text x="297" y="370" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">operate today. The difference is that you send instructions and context, then</text><text x="297" y="393" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">receive generated output.</text><rect x="297" y="425" width="707" height="108" rx="9" fill="#eff6ff" stroke="none"/><text x="316" y="453" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">THE DEVOPS CONNECTION</text><text x="316" y="483" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#10213e" text-anchor="start">Think of a prompt as request input. The context window is a finite buffer.</text><text x="316" y="506" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#10213e" text-anchor="start">Tokens are the units used to measure input, output and often cost.</text><text x="297" y="578" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#10213e" text-anchor="start">A small, familiar request</text><rect x="297" y="600" width="707" height="139" rx="9" fill="#0f172a" stroke="none"/><text x="315" y="627" font-family="monospace" font-size="11" font-weight="400" fill="#dbeafe" text-anchor="start">POST /v1/responses</text><text x="315" y="653" font-family="monospace" font-size="11" font-weight="400" fill="#dbeafe" text-anchor="start">Authorization: Bearer &lt;your-server-side-token&gt;</text><text x="315" y="679" font-family="monospace" font-size="11" font-weight="400" fill="#dbeafe" text-anchor="start"></text><text x="315" y="705" font-family="monospace" font-size="11" font-weight="400" fill="#dbeafe" text-anchor="start">{ &quot;model&quot;: &quot;&lt;model&gt;&quot;, &quot;input&quot;: &quot;Summarize this runbook&quot; }</text><text x="297" y="773" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Keep credentials on the server. Add a timeout, a retry limit and a budget. Validate</text><text x="297" y="796" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">the returned structure before using it downstream.</text><a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods/POST" aria-label="https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods/POST"><text x="297" y="867" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#2563eb" text-anchor="start">Reference: MDN · HTTP POST ↗</text></a><rect x="1054" y="223" width="344" height="271" rx="14" fill="white" stroke="#e3eaf4"/><text x="1076" y="259" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">Make it stick.</text><text x="1076" y="294" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">You have the explanation. Practise</text><text x="1076" y="317" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">recalling the key decisions.</text><text x="1076" y="362" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Related deck</text><text x="1076" y="390" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10213e" text-anchor="start">Calling an LLM</text><a href="#card-concept" aria-label="card-concept"><rect x="1076" y="423" width="299" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="1225.5" y="450" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Practise this concept →</text></a><rect x="1054" y="515" width="344" height="203" rx="12" fill="#eff6ff" stroke="none"/><svg x="1076" y="538" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><text x="1076" y="590" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#10213e" text-anchor="start">Try it in your own workflow</text><text x="1076" y="625" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Sketch the request, timeout, failure</text><text x="1076" y="648" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">path and log fields for a read-only</text><text x="1076" y="671" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">runbook assistant.</text><text x="1076" y="695" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#2563eb" text-anchor="start">Build-it guide · self-reported task</text></svg>