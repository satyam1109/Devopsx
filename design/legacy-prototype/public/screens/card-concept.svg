<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" role="group" aria-labelledby="title desc"><title id="title">Flashcard / Concept</title><desc id="desc">Flashcard / Concept</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="1440" height="77" rx="0" fill="white" stroke="none"/><rect x="30" y="30" width="31" height="31" rx="8" fill="#2563eb" stroke="none"/><svg x="35" y="35" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="72" y="53" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">fieldwork</text><a href="#deck" aria-label="deck"><text x="270" y="46" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">←  Calling an LLM</text></a><text x="720" y="46" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">TODAY’S SESSION</text><a href="#deck" aria-label="deck"><text x="1360" y="46" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="end">Save &amp; exit  ×</text></a><text x="320" y="127" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Card 1 of 5</text><text x="1120" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">Demo session · due reviews first</text><rect x="320" y="143" width="800" height="5" rx="3" fill="#e8eef7" stroke="none"/><rect x="320" y="143" width="160.0" height="5" rx="3" fill="#2563eb" stroke="none"/><rect x="320" y="179" width="800" height="570" rx="17" fill="white" stroke="#e3eaf4"/><rect x="348" y="203" width="190" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="359" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">CONCEPT</text><text x="1090" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">PYTHON + APIS</text><text x="364" y="302" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#10213e" text-anchor="start">Why is a context window like a finite</text><text x="364" y="339" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#10213e" text-anchor="start">buffer?</text><text x="364" y="394" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Recall the idea before revealing the answer.</text><rect x="364" y="443" width="712" height="135" rx="10" fill="#f8fafc" stroke="#e3eaf4"/><svg x="389" y="465" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="427" y="484" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#10213e" text-anchor="start">Think it through before you turn the card.</text><text x="427" y="518" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">A short pause to recall is where the learning happens.</text><a href="#card-concept-answer" aria-label="card-concept-answer"><rect x="364" y="659" width="712" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="720.0" y="686" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Reveal answer   ·   Space</text></a><text x="720" y="793" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">Try to recall first. You can always revisit the explanation.</text><a href="#report" aria-label="report"><text x="320" y="868" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Report a problem</text></a><a href="#resource" aria-label="resource"><text x="1120" y="868" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Read the explainer ↗</text></a><text x="720" y="949" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Free learning · One concept at a time · Your progress is private</text></svg>