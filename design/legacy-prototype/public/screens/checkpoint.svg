"/><path d="m15 15 6 6"/></svg><text x="1013" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Search concepts, decks, resources</text></a><svg x="1283" y="28" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 6 3 8H3c0-2 3-2 3-8m4 12h4"/></svg><rect x="1329" y="21" width="33" height="33" rx="17" fill="#dbeafe" stroke="none"/><text x="1345" y="42" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">AJ</text><rect x="1375" y="26" width="47" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1386" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">Free</text><text x="270" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="start">FIELDWORK / DEVOPS TO FDE</text><text x="1398" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="end">Design concept · illustrative learner data</text><text x="270" y="118" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">YOUR LEARNING WORKSPACE</text><text x="270" y="158" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#10213e" text-anchor="start">Understanding you can put to work.</text><text x="270" y="187" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A checkpoint checks your judgment across the phase, with clear guidance on what to revisit.</text><rect x="270" y="223" width="695" height="352" rx="15" fill="white" stroke="#e3eaf4"/><rect x="295" y="246" width="197" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="306" y="263" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">PHASE 3 CHECKPOINT</text><text x="295" y="318" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10213e" text-anchor="start">Python + APIs</text><text x="295" y="354" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">12 mixed scenario cards. Score at least 80% to unlock RAG &amp;</text><text x="295" y="377" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">grounding.</text><text x="295" y="438" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="start">YOUR LATEST ATTEMPT</text><text x="295" y="483" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#2563eb" text-anchor="start">83%</text><rect x="408" y="454" width="88" height="25" rx="6" fill="#ecfdf5" stroke="none"/><text x="419" y="471" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e" text-anchor="start">PASSED</text><text x="408" y="495" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">10 of 12 questions correct</text><a href="#journey" aria-label="journey"><rect x="295" y="514" width="205" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="397.5" y="541" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Continue to next phase →</text></a><rect x="988" y="223" width="410" height="352" rx="14" fill="#eff6ff" stroke="none"/><svg x="1014" y="249" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3c6-3 8 3 14 0v11c-6 3-8-3-14 0"/></svg><text x="1014" y="313" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">A useful next step</text><text x="1014" y="348" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Build a small script that calls a model API</text><text x="1014" y="371" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">with validated input, a timeout and a token</text><text x="1014" y="394" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">budget.</text><a href="#resource" aria-label="resource"><rect x="1014" y="430" width="358" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="1193.0" y="457" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Open written build-it guide</text></a><text x="1014" y="510" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Completion is self-reported in phase 1.</text><text x="1014" y="534" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Verified labs are planned for phase 2.</text><text x="270" y="628" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10213e" text-anchor="start">Know where to focus</text><rect x="270" y="652" width="1128" height="60" rx="9" fill="white" stroke="#e3eaf4"/><text x="290" y="687" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">Structured outputs</text><text x="915" y="687" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">Strong · 4 / 4 questions</text><a href="#deck" aria-label="deck"><text x="1375" y="687" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Revisit deck →</text></a><rect x="270" y="724" width="1128" height="60" rx="9" fill="white" stroke="#e3eaf4"/><text x="290" y="759" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">Token and context limits</text><text x="915" y="759" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">Strong · 3 / 3 questions</text><a href="#deck" aria-label="deck"><text x="1375" y="759" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Revisit deck →</text></a><rect x="270" y="796" width="1128" height="60" rx="9" fill="white" stroke="#e3eaf4"/><text x="290" y="831" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">Retries and failure paths</text><text x="915" y="831" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#c2410c" text-anchor="start">Revisit · 3 / 5 questions</text><a href="#deck" aria-label="deck"><text x="1375" y="831" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Revisit deck →</text></a><text x="270" y="907" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">If you score below 80%, revisit the suggested decks and retry after 24 hours.</text></svg>