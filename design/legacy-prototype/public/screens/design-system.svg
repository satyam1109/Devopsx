f" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Secondary action</text></a><rect x="521" y="624" width="186" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="532" y="641" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">PHASE 3 · CURRENT</text><rect x="728" y="624" width="95" height="25" rx="6" fill="#ecfdf5" stroke="none"/><text x="739" y="641" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e" text-anchor="start">PASSED</text><rect x="50" y="716" width="640" height="189" rx="14" fill="white" stroke="#e3eaf4"/><text x="73" y="754" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#10213e" text-anchor="start">Layout &amp; interaction</text><text x="73" y="790" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Desktop 1440 px · sidebar 234 px · content padding 36 px</text><text x="73" y="816" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Mobile 390 px · 16 px margins · 44 px minimum actions</text><text x="73" y="842" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Spacing 4 / 8 / 12 / 16 / 24 / 32 · radii 8 / 12 / 16</text><text x="73" y="868" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Keyboard: Space to reveal · 1–4 to rate · visible focus</text><rect x="716" y="716" width="674" height="189" rx="14" fill="#eff6ff" stroke="none"/><text x="740" y="754" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#10213e" text-anchor="start">Write for the engineer you’re helping.</text><text x="740" y="795" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Connect a new idea to 