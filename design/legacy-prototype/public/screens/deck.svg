 stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="1073" y="366" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#10213e" text-anchor="start">Set timeouts, retries and budgets</text><svg x="1046" y="386" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="1073" y="399" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#10213e" text-anchor="start">Keep credentials out of the client</text><text x="270" y="493" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10213e" text-anchor="start">A little of every kind of thinking</text><rect x="270" y="518" width="1128" height="58" rx="9" fill="white" stroke="#e3eaf4"/><svg x="289" y="537" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="328" y="543" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#10213e" text-anchor="start">Concept</text><text x="536" y="552" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Recall the idea in your own words.</text><a href="#card-concept" aria-label="card-concept"><text x="1376" y="552" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Preview →</text></a><rect x="270" y="587" width="1128" height="58" rx="9" fill="white" stroke="#e3eaf4"/><svg x="289" y="606" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3c6-3 8 3 14 0v11c-6 3-8-3-14 0"/></svg><text x="328" y="612" font-family="Space Grotesk, Inter, Arial, sans-serif" font-