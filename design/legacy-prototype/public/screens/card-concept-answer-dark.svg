y="179" width="800" height="570" rx="17" fill="#111d31" stroke="#26344c"/><rect x="348" y="203" width="190" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="359" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">CONCEPT</text><text x="1090" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">PYTHON + APIS</text><text x="364" y="302" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#e2e8f0" text-anchor="start">Why is a context window like a finite</text><text x="364" y="339" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#e2e8f0" text-anchor="start">buffer?</text><rect x="364" y="394" width="130" height="25" rx="6" fill="#ecfdf5" stroke="none"/><text x="375" y="411" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e" text-anchor="start">THE ANSWER</text><text x="364" y="450" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="start">Both have a limited capacity. A context window holds the input</text><text x="364" y="477" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="start">and generated output the model can work with in one request.</text><text x="364" y="504" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="start">If you exceed the limit, input must be reduced or rejected.</text><rect x="348" y="584" width="744" height="75" rx="9" fill="#172d51" stroke="none"/><text x="366" y="611" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#2563eb" text-anchor="start">WHY IT MATTERS IN DEVOPS</text><text x="366" y="639" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">Reliable systems make limits, permissions and failure behavior explicit.</text><a href="#resource" aria-label="resource"><text x="364" y="708" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">Source context &amp; deeper explanation →</text></a><text x="720" y="788" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">How well did you recall it?</text><a href="#card-scenario" aria-label="card-scenario"><rect x="320" y="812" width="185" height="62" rx="9" fill="#111d31" stroke="#26344c"/><text x="412" y="840" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#b91c1c" text-anchor="middle">Again</text><text x="412" y="860" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#94a3b8" text-anchor="middle">1 · Review sooner</text></a><a href="#card-scenario" aria-label="card-scenario"><rect x="525" y="812" width="185" height="62" rx="9" fill="#111d31" stroke="#26344c"/><text x="617" y="840" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#c2410c" text-anchor="middle">Hard</text><text x="617" y="860" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#94a3b8" text-anchor="middle">2 · Review sooner</text></a><a href="#card-scenario" aria-label="card-scenario"><rect x="730" y="812" width="185" height="62" rx="9" fill="#111d31" stroke="#26344c"/><text x="822" y="840" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Good</text><text x="822" y="860" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#94a3b8" text-anchor="middle">3 · Schedule next review</text></a><a href="#card-scenario" aria-label="card-scenario"><rect x="935" y="812" width="185" height="62" rx="9" fill="#111d31" stroke="#26344c"/><text x="1027" y="840" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f766e" text-anchor="middle">Easy</text><text x="1027" y="860" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#94a3b8" text-anchor="middle">4 · Schedule next review</text></a><text x="720" y="908" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">Illustrative ratings. Production scheduling uses FSRS; intervals depend on your review history.</text><text x="720" y="949" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8" text-anchor="middle">Free learning · One concept at a time · Your progress is private</text></svg>