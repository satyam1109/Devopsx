<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1100" viewBox="0 0 1440 1100" role="group" aria-labelledby="title desc"><title id="title">Welcome / Public landing</title><desc id="desc">Welcome / Public landing</desc><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="1440" height="1100" rx="0" fill="white" stroke="none"/><rect x="80" y="28" width="31" height="31" rx="8" fill="#2563eb" stroke="none"/><svg x="85" y="33" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="122" y="51" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">fieldwork</text><a href="#journey" aria-label="journey"><text x="550" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">The journey</text></a><a href="#library" aria-label="library"><text x="690" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Resource library</text></a><a href="#card-concept" aria-label="card-concept"><text x="855" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">How flashcards work</text></a><a href="#onboarding" aria-label="onboarding"><rect x="1120" y="24" width="100" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="1170.0" y="51" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Log in</text></a><a href="#onboarding" aria-label="onboarding"><rect x="1232" y="24" width="128" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="1296.0" y="51" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Start free →</text></a><rect x="80" y="126" width="345" height="29" rx="6" fill="#eff6ff" stroke="#e3eaf4"/><text x="94" y="145" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">BUILT FOR DEVOPS, SRE &amp; CLOUD ENGINEERS</text><text x="80" y="227" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="49" font-weight="700" fill="#10213e" text-anchor="start">You know infrastructure.</text><text x="80" y="287" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="49" font-weight="700" fill="#10213e" text-anchor="start">Now make AI</text><text x="80" y="347" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="49" font-weight="700" fill="#2563eb" text-anchor="start">your next strength.</text><text x="80" y="397" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">Go from operating cloud systems to understanding, building</text><text x="80" y="424" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">and deploying AI. One clear explanation. One practical</text><text x="80" y="451" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="start">card. One step forward.</text><a href="#onboarding" aria-label="onboarding"><rect x="80" y="508" width="196" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="178.0" y="535" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Start learning for free →</text></a><a href="#card-concept" aria-label="card-concept"><rect x="291" y="508" width="181" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="381.5" y="535" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Try a sample card</text></a><text x="80" y="583" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Free learning, always. No credit card. About 10 minutes a day.</text><rect x="830" y="155" width="475" height="405" rx="24" fill="#eff6ff" stroke="#e3eaf4"/><rect x="868" y="193" width="322" height="91" rx="12" fill="white" stroke="#e3eaf4"/><rect x="884" y="213" width="45" height="45" rx="10" fill="#eff6ff" stroke="none"/><svg x="895" y="224" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><text x="945" y="229" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">Infrastructure you know</text><text x="945" y="254" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Linux · Kubernetes · Terraform</text><rect x="902" y="307" width="322" height="91" rx="12" fill="white" stroke="#e3eaf4"/><rect x="918" y="327" width="45" height="45" rx="10" fill="#eff6ff" stroke="none"/><svg x="929" y="338" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="979" y="343" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">AI concepts that click</text><text x="979" y="368" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">LLMs · Retrieval · Safe agents</text><rect x="936" y="421" width="322" height="91" rx="12" fill="white" stroke="#e3eaf4"/><rect x="952" y="441" width="45" height="45" rx="10" fill="#eff6ff" stroke="none"/><svg x="963" y="452" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V3c6-3 8 3 14 0v11c-6 3-8-3-14 0"/></svg><text x="1013" y="457" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#10213e" text-anchor="start">Real-world delivery</text><text x="1013" y="482" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Discover · Build · Deploy</text><rect x="1110" y="136" width="173" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1121" y="153" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">YOUR NEXT CHAPTER</text><rect x="1220" y="511" width="91" height="61" rx="12" fill="#2563eb" stroke="none"/><text x="1265" y="535" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">7 phases</text><text x="1265" y="555" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#dbeafe" text-anchor="middle">one clear path</text><path d="M80 638 L1360 638" stroke="#e3eaf4"/><text x="105" y="690" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">01</text><text x="105" y="724" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#10213e" text-anchor="start">Learn in familiar language</text><text x="555" y="690" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">02</text><text x="555" y="724" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#10213e" text-anchor="start">Recall with practical flashcards</text><text x="1015" y="690" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">03</text><text x="1015" y="724" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#10213e" text-anchor="start">Apply it to real work</text><text x="105" y="754" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Understand tokens, RAG and agents through</text><text x="105" y="777" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">concepts you already use in DevOps.</text><text x="555" y="754" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Scenario cards build judgment. Daily spaced</text><text x="555" y="777" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">reviews help the ideas stay with you.</text><text x="1015" y="754" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Build-it guides turn each phase into</text><text x="1015" y="777" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">something you can explain and</text><text x="1015" y="800" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">demonstrate.</text><rect x="80" y="855" width="1280" height="159" rx="15" fill="#f8fafc" stroke="#e3eaf4"/><text x="108" y="897" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#10213e" text-anchor="start">Two goals. A shared foundation.</text><text x="108" y="927" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Choose your direction. Switch whenever your goals change.</text><a href="#onboarding" aria-label="onboarding"><rect x="725" y="884" width="262" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="856.0" y="911" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Learn AI · 6 phases →</text></a><a href="#onboarding" aria-label="onboarding"><rect x="1003" y="884" width="307" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="1156.5" y="911" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Become an FDE · 7 phases →</text></a><text x="80" y="1060" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#10213e" text-anchor="start">FIELDWORK</text><text x="1360" y="1060" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">Learning is free. Paid labs are planned for a later release.</text></svg>