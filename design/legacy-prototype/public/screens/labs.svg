"10" fill="#eff6ff" stroke="none"/><svg x="35" y="808" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="35" y="849" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#10213e" text-anchor="start">Small sessions. Real growth.</text><text x="35" y="870" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="start">Build a habit in 10 minutes a day.</text><path d="M20 926 L214 926" stroke="#e3eaf4"/><rect x="28" y="946" width="32" height="32" rx="16" fill="#dbeafe" stroke="none"/><text x="44" y="966" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">AJ</text><text x="71" y="958" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#10213e" text-anchor="start">Alex Jordan</text><text x="71" y="975" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="start">DevOps engineer</text><rect x="235" y="0" width="1205" height="76" rx="0" fill="white" stroke="none"/><path d="M235 76 L1440 76" stroke="#e3eaf4"/><text x="270" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Workspace</text><text x="349" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="start">/</text><text x="368" y="44" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#10213e" text-anchor="start">Hands-on labs</text><a href="#library" aria-label="library"><rect x="974" y="20" width="283" height="36" rx="7" fill="#f8fafc" stroke="#e3eaf4"/><svg x="987" y="29" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><text x="1013" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Search concepts, decks, resources</text></a><svg x="1283" y="28" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 6 3 8H3c0-2 3-2 3-8m4 12h4"/></svg><rect x="1329" y="21" width="33" height="33" rx="17" fill="#dbeafe" stroke="none"/><text x="1345" y="42" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">AJ</text><rect x="1375" y="26" width="47" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1386" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">Free</text><text x="270" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="start">FIELDWORK / DEVOPS TO FDE</text><text x="1398" y="968" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="400" fill="#64748b" text-anchor="end">Design concept · illustrative learner data</text><text x="270" y="118" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">YOUR LEARNING WORKSPACE</text><text x="270" y="158" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#10213e" text-anchor="start">Learn it here. Build it next.</text><text x="270" y="187" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Written build-it guides are available now. Sandboxed, auto-graded labs are planned for phase 2.</text><rect x="270" y="224" width="1128" height="197" rx="14" fill="#eff6ff" stroke="#cfe0fc"/><rect x="296" y="249" width="216" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="307" y="266" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">PHASE 2 · COMING SOON</text><text x="296" y="314" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#10213e" text-anchor="start">Real environments. Measurable progress.</text><text x="296" y="354" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Join a lab waitlist to hear when hands-on environments become available.</text><text x="296" y="387" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">Learning, reviews and progress tracking remain free.</text><rect x="270" y="449" width="362" height="347" rx="14" fill="white" stroke="#e3eaf4"/><svg x="294" y="476" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><rect x="294" y="527" width="230" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="305" y="544" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">AGENTS + MCP</text><text x="294" y="591" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">Read-only incident</text><text x="294" y="619" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">assistant</text><text x="294" y="663" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Connect runbooks to a safe, bounded</text><text x="294" y="686" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">tool workflow.</text><a href="#waitlist" aria-label="waitlist"><rect x="294" y="723" width="314" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="451.0" y="750" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Join lab waitlist</text></a><rect x="653" y="449" width="362" height="347" rx="14" fill="white" stroke="#e3eaf4"/><svg x="677" y="476" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><rect x="677" y="527" width="230" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="688" y="544" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">RAG &amp; GROUNDING</text><text x="677" y="591" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">Permission-aware RAG</text><text x="677" y="663" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Retrieve the right evidence for the</text><text x="677" y="686" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">right user.</text><a href="#waitlist" aria-label="waitlist"><rect x="677" y="723" width="314" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="834.0" y="750" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Join lab waitlist</text></a><rect x="1036" y="449" width="362" height="347" rx="14" fill="white" stroke="#e3eaf4"/><svg x="1060" y="476" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></svg><rect x="1060" y="527" width="230" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1071" y="544" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">PRODUCTION AI</text><text x="1060" y="591" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">Production AI service</text><text x="1060" y="663" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Ship with evals, monitoring, budgets</text><text x="1060" y="686" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">and rollback.</text><a href="#waitlist" aria-label="waitlist"><rect x="1060" y="723" width="314" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="1217.0" y="750" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Join lab waitlist</text></a><text x="270" y="854" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">No checkout in this release. Lab pricing and token allowances are still to be decided.</text></svg>