ial, sans-serif" font-size="28" font-weight="700" fill="#10213e" text-anchor="start">5</text><text x="328" y="532" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Five ways to think</text><rect x="591" y="449" width="259" height="102" rx="12" fill="white" stroke="#e3eaf4"/><text x="611" y="475" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Day streak</text><text x="611" y="509" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10213e" text-anchor="start">7</text><text x="611" y="532" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Your week is taking shape</text><rect x="874" y="449" width="259" height="102" rx="12" fill="white" stroke="#e3eaf4"/><text x="894" y="475" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Daily habit</text><text x="894" y="509" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#10213e" text-anchor="start">~10 min</text><text x="894" y="532" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">A small, useful investment</text><rect x="308" y="583" width="825" height="129" rx="14" fill="#eff6ff" stroke="none"/><text x="336" y="620" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#10213e" text-anchor="start">Next up: put it into practice.</text><text x="336" y="649" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Continue the written build-it guide, or revisit an explanation while it’s fresh.</text><a href="#resource" aria-label="resource"><text x="336" y="681" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="start">Op