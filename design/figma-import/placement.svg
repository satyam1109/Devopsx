<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" role="group" aria-labelledby="title desc"><title id="title">Optional placement test</title><desc id="desc">Optional placement test</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f8fafc" stroke="none"/><rect x="60" y="35" width="31" height="31" rx="8" fill="#2563eb" stroke="none"/><svg x="65" y="40" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="102" y="58" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">fieldwork</text><rect x="1190" y="42" width="205" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="1201" y="59" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">OPTIONAL · 10–15 MIN</text><text x="720" y="164" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">START WHERE YOU ARE</text><text x="720" y="216" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="37" font-weight="700" fill="#10213e" text-anchor="middle">Your experience should count.</text><text x="720" y="257" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">Try a short placement test, or begin with the fundamentals.</text><rect x="370" y="313" width="700" height="328" rx="16" fill="white" stroke="#e3eaf4"/><text x="403" y="359" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">A practical starting point</text><svg x="404" y="394" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="436" y="408" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#10213e" text-anchor="start">A few questions from each learning phase</text><svg x="404" y="439" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="436" y="453" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#10213e" text-anchor="start">Passed phases are marked “tested out” and unlocked</text><svg x="404" y="484" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="436" y="498" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#10213e" text-anchor="start">Those cards still return as low-priority reviews</text><svg x="404" y="529" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg><text x="436" y="543" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#10213e" text-anchor="start">You can skip this and learn everything in order</text><a href="#card-scenario" aria-label="card-scenario"><rect x="403" y="583" width="633" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="719.5" y="610" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Preview a placement question →</text></a><a href="#dashboard" aria-label="dashboard"><rect x="520" y="690" width="400" height="44" rx="8" fill="white" stroke="#e3eaf4"/><text x="720.0" y="717" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Start with the fundamentals</text></a><text x="720" y="795" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">Preview: placement scoring is not implemented in this design prototype.</text></svg>