<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" role="group" aria-labelledby="title desc"><title id="title">Flashcard / Choose The Approach / Answer</title><desc id="desc">Flashcard / Choose The Approach / Answer</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="1440" height="77" rx="0" fill="white" stroke="none"/><rect x="30" y="30" width="31" height="31" rx="8" fill="#2563eb" stroke="none"/><svg x="35" y="35" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 7h10a4 4 0 0 1 0 8H5m10 0 4 6"/></svg><text x="72" y="53" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#10213e" text-anchor="start">fieldwork</text><a href="#deck" aria-label="deck"><text x="270" y="46" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">←  Calling an LLM</text></a><text x="720" y="46" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">TODAY’S SESSION</text><a href="#deck" aria-label="deck"><text x="1360" y="46" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="end">Save &amp; exit  ×</text></a><text x="320" y="127" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Card 5 of 5</text><text x="1120" y="127" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">Demo session · due reviews first</text><rect x="320" y="143" width="800" height="5" rx="3" fill="#e8eef7" stroke="none"/><rect x="320" y="143" width="800.0" height="5" rx="3" fill="#2563eb" stroke="none"/><rect x="320" y="179" width="800" height="570" rx="17" fill="white" stroke="#e3eaf4"/><rect x="348" y="203" width="190" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="359" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">CHOOSE THE APPROACH</text><text x="1090" y="220" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">PYTHON + APIS</text><text x="364" y="302" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#10213e" text-anchor="start">What is the safest first incident</text><text x="364" y="339" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#10213e" text-anchor="start">assistant?</text><rect x="364" y="394" width="130" height="25" rx="6" fill="#ecfdf5" stroke="none"/><text x="375" y="411" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#0f766e" text-anchor="start">THE ANSWER</text><text x="364" y="450" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#10213e" text-anchor="start">A scoped read-only assistant with authorized evidence, bounded</text><text x="364" y="477" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#10213e" text-anchor="start">tool access and a clear escalation path. This limits the blast</text><text x="364" y="504" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#10213e" text-anchor="start">radius while giving the pilot a measurable purpose.</text><rect x="348" y="584" width="744" height="75" rx="9" fill="#eff6ff" stroke="none"/><text x="366" y="611" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#2563eb" text-anchor="start">WHY IT MATTERS IN DEVOPS</text><text x="366" y="639" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#2563eb" text-anchor="start">Reliable systems make limits, permissions and failure behavior explicit.</text><a href="#resource" aria-label="resource"><text x="364" y="708" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">Source context &amp; deeper explanation →</text></a><text x="720" y="790" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">Correct · automatically graded as Good</text><a href="#session-complete" aria-label="session-complete"><rect x="320" y="814" width="800" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="720.0" y="841" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Continue to next card →</text></a><text x="720" y="908" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Illustrative ratings. Production scheduling uses FSRS; intervals depend on your review history.</text><text x="720" y="949" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">Free learning · One concept at a time · Your progress is private</text></svg>