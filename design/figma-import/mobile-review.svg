<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="group" aria-labelledby="title desc"><title id="title">Mobile / daily review</title><desc id="desc">Mobile / daily review</desc><rect x="0" y="0" width="390" height="844" rx="0" fill="#f8fafc" stroke="none"/><rect x="0" y="0" width="390" height="844" rx="0" fill="#f8fafc" stroke="none"/><text x="23" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#10213e" text-anchor="start">9:41</text><text x="363" y="28" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#10213e" text-anchor="end">•••  ▰</text><a href="#dashboard" aria-label="dashboard"><text x="22" y="76" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#10213e" text-anchor="start">←</text></a><text x="195" y="75" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#10213e" text-anchor="middle">Calling an LLM</text><a href="#deck" aria-label="deck"><text x="366" y="75" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="end">×</text></a><path d="M0 99 L390 99" stroke="#e3eaf4"/><text x="20" y="132" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Card 1 of 5</text><text x="370" y="132" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="end">Today’s session</text><rect x="20" y="147" width="350" height="5" rx="3" fill="#e8eef7" stroke="none"/><rect x="20" y="147" width="70.0" height="5" rx="3" fill="#2563eb" stroke="none"/><rect x="16" y="174" width="358" height="429" rx="14" fill="white" stroke="#e3eaf4"/><rect x="34" y="192" width="106" height="25" rx="6" fill="#eff6ff" stroke="none"/><text x="45" y="209" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">CONCEPT</text><text x="34" y="271" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">Why is a context window</text><text x="34" y="303" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#10213e" text-anchor="start">like a finite buffer?</text><text x="34" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Pause for a moment. Recall the idea</text><text x="34" y="370" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">before revealing the answer.</text><rect x="34" y="420" width="322" height="89" rx="9" fill="#eff6ff" stroke="none"/><svg x="49" y="440" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="84" y="449" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Think of the buffers and request</text><text x="84" y="469" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">limits you already work with.</text><a href="#mobile-answer" aria-label="mobile-answer"><rect x="34" y="535" width="322" height="44" rx="8" fill="#2563eb" stroke="none"/><text x="195.0" y="562" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Reveal answer</text></a><text x="195" y="648" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">One idea. One useful moment.</text><a href="#report" aria-label="report"><text x="20" y="779" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748b" text-anchor="start">Report a problem</text></a><text x="370" y="779" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#2563eb" text-anchor="end">Free learning</text><rect x="135" y="824" width="120" height="5" rx="3" fill="#10213e" stroke="none"/></svg>